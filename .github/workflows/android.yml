name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Must match android/build.gradle: compileSdk 35, buildTools 35.0.0,
      # ndkVersion 26.1.10909125 (installing other versions makes Gradle
      # try to download the right ones mid-build, which often fails).
      - name: Set up Android SDK (platform + NDK + CMake for React Native)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Logo / fonts are committed under assets/. These downloads only
      # REFRESH them and never fail the build: a failed or empty download
      # keeps whatever is already committed (RN falls back to the system
      # font if a Manrope file is missing).
      - name: Refresh logo + Manrope fonts (best effort)
        id: assets
        run: |
          mkdir -p assets/fonts android/app/src/main/assets/fonts
          echo "logo_refreshed=false" >> "$GITHUB_OUTPUT"
          if curl -fsSL --retry 3 --max-time 60 \
              "https://vibetalk.hamzabhulla.workers.dev/logo-mark.png" -o /tmp/logo-new.png \
              && [ -s /tmp/logo-new.png ]; then
            cp /tmp/logo-new.png assets/logo-mark.png
            echo "logo_refreshed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not download logo - using the committed assets/logo-mark.png"
          fi
          fetch_font() {
            url=$(curl -s --max-time 30 "https://fonts.googleapis.com/css2?family=Manrope:wght@$1&display=swap" | grep -o "https://[^)]*" | head -1 || true)
            if [ -n "$url" ] && curl -fsSL --retry 2 --max-time 60 "$url" -o "/tmp/Manrope-$2.ttf" && [ -s "/tmp/Manrope-$2.ttf" ]; then
              cp "/tmp/Manrope-$2.ttf" "assets/fonts/Manrope-$2.ttf"
              echo "font $2 ok"
            else
              echo "::warning::Could not download Manrope-$2 (keeping committed copy if any)"
            fi
          }
          fetch_font 400 Regular
          fetch_font 500 Medium
          fetch_font 600 SemiBold
          fetch_font 700 Bold
          fetch_font 800 ExtraBold
          ls assets/fonts/*.ttf >/dev/null 2>&1 && cp assets/fonts/*.ttf android/app/src/main/assets/fonts/ || true
          ls -la assets assets/fonts

      # Launcher icons are committed. Only regenerate them when a fresh
      # real logo was downloaded (the crop assumes the web logo layout).
      - name: Regenerate launcher icons from the downloaded logo
        if: steps.assets.outputs.logo_refreshed == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert assets/logo-mark.png -trim +repage /tmp/mark.png
          convert /tmp/mark.png -crop 100%x58%+0+0 +repage /tmp/mark_only.png
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/mipmap-$1"
            mkdir -p "$dir"
            convert /tmp/mark_only.png -background "#FEFCF7" -flatten -resize $2x$2 -gravity center -extent $2x$2 "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      # The lockfile must be refreshed once locally after the Babel fix
      # (run `pnpm install`, commit pnpm-lock.yaml); until then CI resolves
      # the changed packages itself instead of failing on a stale lockfile.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check (non-blocking)
        continue-on-error: true
        run: pnpm exec tsc --noEmit

      - name: Run unit tests (non-blocking)
        continue-on-error: true
        run: pnpm test --ci --watchAll=false

      # Preferred: ANDROID_KEYSTORE_BASE64 secret (base64 of the .keystore
      # file). Fallback: legacy android/keystore.b64 if you still have it.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/vibetalk-release.keystore
          elif [ -f android/keystore.b64 ]; then
            echo "::warning::Using android/keystore.b64 from the repo. Move it to the ANDROID_KEYSTORE_BASE64 secret and delete it from git."
            base64 --decode android/keystore.b64 > android/app/vibetalk-release.keystore
          else
            echo "::warning::No release keystore found - APK will be signed with the DEBUG key."
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
        env:
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK
        id: apk
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          name="VibeTalk-Android-v1.0.${{ github.run_number }}.apk"
          cp "$src" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibetalk-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VibeTalk Android v1.0.${{ github.run_number }}
          body: |
            VibeTalk Android app (React Native + WatermelonDB, offline-first).
            Download the APK below and install it. Login screen first,
            your chats live on the device and sync when online.
          files: ${{ steps.apk.outputs.path }}
